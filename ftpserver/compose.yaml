services:
  ftp:
    hostname: ftpserver
    restart: always
    build:
      context: ..
      dockerfile: ftpserver/Dockerfile
      args:
        - FTP_USER_PASS=${FTP_PASS}
        - UID=${HOST_UID:-1000}
        - GID=${HOST_GID:-1000}
    env_file:
      - ../.env
    user: ftpuser:ftpgroup
    volumes:
      - ${PROJECT_ROOT}/data:/home/ftpuser/
    ports:
      - "${FTP_PORT}:21"
      - "${FTP_PASV_MIN}-${FTP_PASV_MAX}:30000-31000"
    healthcheck:
      test: ["CMD", "nc", "-zv", "localhost", "21"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
